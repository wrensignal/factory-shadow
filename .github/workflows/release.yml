name: Release verification

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "0.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Verify sealed memfd execution
        run: >-
          python -m pytest
          tests/unit/test_internal_session.py::test_sealed_memfd_executes_approved_bytes_after_same_inode_mutation
      - name: Run test suite
        run: python -m pytest

  package:
    name: Package and manifest verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate plugin and Lima manifests
        run: python ci/verify_release.py
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: python ci/verify_release.py --tag "$GITHUB_REF_NAME"
      - name: Build package
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Scan publishable artifacts
        run: python ci/verify_release.py --dist dist
      - name: Verify clean wheel install
        run: |
          python -m venv /tmp/shadow-clean
          /tmp/shadow-clean/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/shadow-clean/bin/shadow --help
